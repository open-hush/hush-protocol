name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: redocly lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint the spec
        run: npx --yes @redocly/cli@latest lint hush-api.yaml

  build-docs:
    name: build static docs
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static HTML
        run: npx --yes @redocly/cli@latest build-docs hush-api.yaml -o site/index.html

      - name: Upload site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/
